<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Trang không tìm thấy | chinphotos</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Single Page App redirect for deep links on static hosts
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 48px;">
      <h2>404 - Không tìm thấy trang</h2>
      <p>Đang chuyển hướng về trang chủ...</p>
      <a href="/">Bấm vào đây nếu không tự động chuyển hướng</a>
    </div>
  </body>
</html>
