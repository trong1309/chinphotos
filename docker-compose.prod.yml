services:
  mongo:
    image: mongo:7
    container_name: photographer-mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-photographer}
      MONGO_APP_USER: ${MONGO_APP_USER:-photographer_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  server:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/chinphotos}/server:${TAG:-latest}
    build:
      context: ./server
      target: runner
    container_name: photographer-server-prod
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:-https://${DOMAIN}}
      ADMIN_URL: ${ADMIN_URL:-https://${DOMAIN}/admin}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      PUBLIC_UPLOAD_URL: ${PUBLIC_UPLOAD_URL:-/uploads}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/chinphotos}/client:${TAG:-latest}
    build:
      context: ./client
      target: runner
      args:
        VITE_API_URL: /api
    container_name: photographer-client-prod
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/chinphotos}/admin:${TAG:-latest}
    build:
      context: ./admin
      target: runner
      args:
        VITE_BASE: /admin/
        VITE_API_URL: /api
        VITE_USE_MOCK: "false"
    container_name: photographer-admin-prod
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: photographer-caddy-prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - admin
      - server
    networks:
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
