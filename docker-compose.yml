services:
  mongo:
    image: mongo:7
    container_name: photographer-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-photographer}
      MONGO_DB: ${MONGO_DB:-photographer}
      MONGO_APP_USER: ${MONGO_APP_USER:-app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-app_password}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    container_name: photographer-server-dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_APP_USER:-app}:${MONGO_APP_PASSWORD:-app_password}@mongo:27017/${MONGO_DB:-photographer}?authSource=${MONGO_DB:-photographer}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      PUBLIC_UPLOAD_URL: http://localhost:5000/uploads
      JWT_SECRET: ${JWT_SECRET:-photographer_dev_secret_key_change_in_production_123456}
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    container_name: photographer-client-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SITE_URL: http://localhost:5173
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: dev
    container_name: photographer-admin-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_USE_MOCK: "false"
      VITE_BASE: /
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "5174:5174"

volumes:
  mongo_data:
  uploads_data:
